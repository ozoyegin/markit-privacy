<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Markit Android uygulaması ayrıntılı Türkçe kullanım kılavuzu">
  <title>Markit Kullanım Kılavuzu</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef5fc;
      --card: #ffffff;
      --text: #14263c;
      --muted: #60748d;
      --line: #d7e4f0;
      --blue: #1976d2;
      --teal: #0f9d8a;
      --soft: #eaf4ff;
      --code: #f4f7fa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1623;
        --card: #132235;
        --text: #edf5ff;
        --muted: #afbed0;
        --line: #2b4058;
        --blue: #75b8ff;
        --teal: #54d9c4;
        --soft: #172f49;
        --code: #0e1b2a;
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 8% 0%, rgb(25 118 210 / 12%), transparent 34rem),
        var(--bg);
      color: var(--text);
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px max(18px, calc((100% - 980px) / 2));
      background: color-mix(in srgb, var(--card) 90%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: block;
      object-fit: contain;
      border-radius: 8px;
    }
    .topbar a { color: var(--blue); font-size: 14px; font-weight: 700; text-decoration: none; }
    main {
      width: min(940px, calc(100% - 28px));
      margin: 28px auto 56px;
      padding: clamp(22px, 5vw, 58px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 26px;
      box-shadow: 0 20px 60px rgb(22 55 88 / 11%);
    }
    h1, h2, h3 { line-height: 1.25; scroll-margin-top: 82px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 6vw, 3.25rem); letter-spacing: -.035em; }
    h2 {
      margin: 3rem 0 1rem;
      padding-top: 1.4rem;
      border-top: 1px solid var(--line);
      font-size: clamp(1.4rem, 4vw, 1.9rem);
    }
    h3 { margin: 2rem 0 .6rem; font-size: 1.18rem; color: var(--teal); }
    p, ul, ol { margin: .75rem 0; }
    li + li { margin-top: .32rem; }
    a { color: var(--blue); text-underline-offset: 3px; }
    blockquote {
      margin: 1.4rem 0;
      padding: 14px 18px;
      background: var(--soft);
      border-left: 4px solid var(--blue);
      border-radius: 12px;
      color: var(--muted);
    }
    code {
      padding: .15em .38em;
      background: var(--code);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: .92em;
    }
    pre {
      overflow-x: auto;
      padding: 16px;
      background: var(--code);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    pre code { padding: 0; border: 0; background: transparent; }
    .table-wrap { overflow-x: auto; margin: 1.2rem 0; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; }
    th { background: var(--soft); }
    tr:last-child td { border-bottom: 0; }
    hr { margin: 2.4rem 0; border: 0; border-top: 1px solid var(--line); }
    .loading { padding: 36px 0; color: var(--muted); text-align: center; }
    .error { padding: 18px; color: #b91c1c; background: #fff1f2; border-radius: 12px; }
    .back-top {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, #2563eb, #0f9d8a);
      border-radius: 15px;
      text-decoration: none;
      box-shadow: 0 10px 28px rgb(25 118 210 / 28%);
    }
    @media (max-width: 600px) {
      main { width: calc(100% - 16px); margin-top: 10px; border-radius: 20px; }
      .topbar { padding-inline: 12px; }
      .topbar a { font-size: 12px; }
    }
    @media print {
      body { background: white; }
      .topbar, .back-top { display: none; }
      main { width: 100%; margin: 0; padding: 0; border: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="brand-mark" src="./markit-icon.png" alt="Markit"><span>Markit Kılavuzu</span></div>
    <a href="https://ozoyegin.github.io/markit-privacy/privacy-policy.html">Privacy Policy</a>
  </header>
  <main id="content" aria-live="polite"><p class="loading">Kullanım kılavuzu yükleniyor…</p></main>
  <a class="back-top" href="#" aria-label="Sayfanın başına dön">↑</a>

  <script>
    const escapeHtml = value => value
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');

    function inline(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\[([^\]]+)]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function slug(value) {
      return value.toLocaleLowerCase('tr-TR')
        .replace(/[^\p{L}\p{N}]+/gu, '-').replace(/(^-|-$)/g, '');
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, '').split('\n');
      const output = [];
      let paragraph = [];
      let listType = '';
      let inCode = false;
      let code = [];

      const closeParagraph = () => {
        if (paragraph.length) output.push('<p>' + inline(paragraph.join(' ')) + '</p>');
        paragraph = [];
      };
      const closeList = () => {
        if (listType) output.push('</' + listType + '>');
        listType = '';
      };

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('```')) {
          closeParagraph(); closeList();
          if (inCode) {
            output.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
            code = [];
          }
          inCode = !inCode;
          continue;
        }
        if (inCode) { code.push(line); continue; }
        if (/^\|.+\|$/.test(line) && i + 1 < lines.length && /^\|?[\s:|-]+\|$/.test(lines[i + 1])) {
          closeParagraph(); closeList();
          const headers = line.slice(1, -1).split('|').map(cell => cell.trim());
          i += 2;
          const rows = [];
          while (i < lines.length && /^\|.+\|$/.test(lines[i])) {
            rows.push(lines[i].slice(1, -1).split('|').map(cell => cell.trim()));
            i++;
          }
          i--;
          output.push('<div class="table-wrap"><table><thead><tr>'
            + headers.map(cell => '<th>' + inline(cell) + '</th>').join('')
            + '</tr></thead><tbody>'
            + rows.map(row => '<tr>' + row.map(cell => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('')
            + '</tbody></table></div>');
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.+)$/);
        if (heading) {
          closeParagraph(); closeList();
          const level = heading[1].length;
          output.push('<h' + level + ' id="' + slug(heading[2]) + '">' + inline(heading[2]) + '</h' + level + '>');
          continue;
        }
        if (/^---+$/.test(line.trim())) {
          closeParagraph(); closeList(); output.push('<hr>'); continue;
        }
        if (line.startsWith('> ')) {
          closeParagraph(); closeList(); output.push('<blockquote>' + inline(line.slice(2)) + '</blockquote>'); continue;
        }
        const unordered = line.match(/^[-*]\s+(.+)$/);
        const ordered = line.match(/^\d+\.\s+(.+)$/);
        if (unordered || ordered) {
          closeParagraph();
          const wanted = unordered ? 'ul' : 'ol';
          if (listType !== wanted) { closeList(); output.push('<' + wanted + '>'); listType = wanted; }
          output.push('<li>' + inline((unordered || ordered)[1]) + '</li>');
          continue;
        }
        if (!line.trim()) { closeParagraph(); closeList(); continue; }
        paragraph.push(line.trim());
      }
      closeParagraph(); closeList();
      return output.join('\n');
    }

    fetch('./KULLANIM_KILAVUZU_TR.md', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.text();
      })
      .then(markdown => { document.getElementById('content').innerHTML = renderMarkdown(markdown); })
      .catch(() => {
        document.getElementById('content').innerHTML =
          '<p class="error">Kılavuz yüklenemedi. Lütfen KULLANIM_KILAVUZU_TR.md dosyasının bu sayfayla aynı klasörde olduğundan emin olun.</p>';
      });
  </script>
</body>
</html>
